<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile Diagram Editor</title>
  <style>
    :root { color-scheme: light; font-family: "Noto Sans Thai", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f7f2; color: #172217; }
    main { max-width: 1540px; margin: auto; padding: 18px; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
    h1 { margin: 0 auto 0 0; font-size: 23px; }
    .back, select, button { font: inherit; border-radius: 9px; padding: 9px 12px; }
    .back, select { border: 1px solid #bdccb9; background: white; color: #1f5e3b; text-decoration: none; }
    button { cursor: pointer; border: 0; background: #276c42; color: white; font-weight: 700; }
    .stage { overflow: auto; padding: 10px; border: 1px solid #dce5d9; border-radius: 14px; background: white; box-shadow: 0 5px 22px #31452d12; }
    canvas { display: block; width: min(100%, 1420px); height: auto; margin: auto; touch-action: none; }
    .hint { margin: 11px 4px 0; color: #526052; font-size: 13px; line-height: 1.7; }
    .loading { padding: 30px; text-align: center; color: #526052; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Profile Diagram Editor</h1>
      <a class="back" href="/profile">กลับไปหน้า Profile Studio</a>
      <select id="profile" aria-label="เลือกแนวสำรวจ"></select>
      <button id="export" type="button">Export JPEG</button>
    </header>
    <section class="stage">
      <canvas id="diagram" aria-label="แก้ไของค์ประกอบใน profile diagram"></canvas>
      <p class="loading" id="loading">กำลังเตรียม layer ของ profile...</p>
    </section>
    <p class="hint">คลิกพุ่มหรือกิ่งเพื่อเลือก · ลากเพื่อย้าย · ลากมุมเพื่อย่อ–ขยายโดยคงสัดส่วน · ลากวงกลมเหนือกิ่งเพื่อหมุนกิ่งแรก · Ctrl+Z ย้อนกลับ · Ctrl+Shift+Z หรือ Ctrl+Y ทำซ้ำ · JPEG ที่ export จะไม่มีเส้นหรือจุดช่วยแก้ไข</p>
  </main>
  <script>
    const canvas = document.querySelector('#diagram');
    const context = canvas.getContext('2d');
    const select = document.querySelector('#profile');
    const loading = document.querySelector('#loading');
    const state = { manifest: null, sheet: null, images: {}, transforms: {}, selected: null, drag: null, showUI: true, scene: [], history: [], redo: [] };
    const loadImage = (source) => new Promise((resolve, reject) => { const image = new Image(); image.onload = () => resolve(image); image.onerror = reject; image.src = source; });
    const assetUrl = (file) => `/profile-editor/scene-assets/${file}`;
    const dynamicColors = ['#58a55c', '#258ddb', '#8e24aa', '#f4511e', '#008f80', '#7b9e39'];
    function transformStorageKey() { return state.manifest?.sessionId ? `profile-editor-transforms:${state.manifest.sessionId}` : null; }
    function saveTransforms() { const key = transformStorageKey(); if (key) localStorage.setItem(key, JSON.stringify(state.transforms)); }
    function readRenderedProfiles() { return new Promise((resolve) => { const request = indexedDB.open('forest-workspace-files', 1); request.onerror = () => resolve(null); request.onsuccess = () => { const db = request.result; const get = db.transaction('files', 'readonly').objectStore('files').get('profile-editor-render'); get.onsuccess = () => { db.close(); resolve(Array.isArray(get.result) && get.result.length ? get.result : null); }; get.onerror = () => { db.close(); resolve(null); }; }; }); }
    function readServerScene() { return new Promise((resolve) => { const request = indexedDB.open('forest-workspace-files', 1); request.onerror = () => resolve(null); request.onsuccess = () => { const db = request.result; const get = db.transaction('files', 'readonly').objectStore('files').get('profile-editor-server-scene'); get.onsuccess = () => { db.close(); resolve(get.result && get.result.sessionId ? get.result : null); }; get.onerror = () => { db.close(); resolve(null); }; }; }); }
    function readUploadedScene() { return new Promise((resolve) => { const request = indexedDB.open('forest-workspace-files', 1); request.onerror = () => resolve(null); request.onsuccess = () => { const db = request.result; const get = db.transaction('files', 'readonly').objectStore('files').get('profile-editor-scene'); get.onsuccess = () => { db.close(); resolve(get.result && get.result.version === 1 ? get.result : null); }; get.onerror = () => { db.close(); resolve(null); }; }; }); }
    function uploadedManifest(scene) { return { dynamic: true, sheets: scene.sheets.map((sheet) => ({ name: sheet.name, slug: sheet.slug, trees: sheet.trees.map((tree, index) => { const sprite = index % 17; const x = 435 + ((tree.x + 5) / 50) * 3560; const ground = 3300; const height = Math.max(260, Math.min(2050, tree.height * 95)); const crownW = Math.max(190, Math.min(760, (tree.crownXPlus + tree.crownXMinus) * 92)); const crownH = Math.max(110, Math.min(620, (tree.height - tree.firstBranch) * 55)); const crownY = ground - height; return { ...tree, color: dynamicColors[index % dynamicColors.length], parts: { trunk: { file: `tree_${sprite}_trunk.png`, x: x - Math.max(20, height * .045), y: crownY + crownH * .28, w: Math.max(40, height * .09), h: ground - (crownY + crownH * .28) }, branch: { file: `tree_${sprite}_branch.png`, x: x - crownW * .22, y: ground - Math.max(180, tree.firstBranch * 95) - crownH * .18, w: crownW * .44, h: Math.max(90, crownH * .38) }, crown: { file: `tree_${sprite}_crown.png`, x: x - crownW / 2, y: crownY, w: crownW, h: crownH } } }; }) })) }; }
    function drawUploadedBase(sheet) { context.fillStyle = 'white'; context.fillRect(0, 0, canvas.width, canvas.height); context.strokeStyle = '#1a1a1a'; context.lineWidth = 6; context.strokeRect(435, 420, 3560, 790); context.font = '38px Noto Sans Thai, sans-serif'; context.fillStyle = '#222'; context.fillText('แผนผังเรือนยอด', 435, 360); const species = [...new Set(sheet.trees.map((tree) => tree.species))]; sheet.trees.forEach((tree) => { const x = 435 + ((tree.x + 5) / 50) * 3560; const y = 815 + Math.max(-260, Math.min(260, tree.y * 40)); context.fillStyle = tree.color; context.globalAlpha = .55; context.beginPath(); context.ellipse(x, y, Math.max(70, (tree.crownXPlus + tree.crownXMinus) * 45), Math.max(55, (tree.crownYPlus + tree.crownYMinus) * 38), 0, 0, Math.PI * 2); context.fill(); context.globalAlpha = 1; context.fillStyle = '#111'; context.beginPath(); context.arc(x, y, 8, 0, Math.PI * 2); context.fill(); }); context.fillStyle = '#222'; context.fillText('ภาพด้านข้าง', 435, 1470); context.strokeStyle = '#d5d5d5'; context.lineWidth = 2; for (let x = 435; x <= 3995; x += 71.2) { context.beginPath(); context.moveTo(x, 1560); context.lineTo(x, 3300); context.stroke(); } for (let y = 1560; y <= 3300; y += 87) { context.beginPath(); context.moveTo(435, y); context.lineTo(3995, y); context.stroke(); } context.strokeStyle = '#6b7280'; context.lineWidth = 5; context.beginPath(); context.moveTo(435, 3300); context.lineTo(3995, 3300); context.stroke(); context.font = '30px Noto Sans Thai, sans-serif'; species.forEach((name, index) => { const x = 500 + index * Math.max(460, 3300 / Math.max(species.length, 1)); context.fillStyle = dynamicColors[index % dynamicColors.length]; context.fillRect(x, 3820, 32, 32); context.fillStyle = '#222'; context.fillText(name, x + 48, 3848); }); }
    const transformId = (tree, part) => `${state.sheet.slug}:${tree.id}:${part}`;
    function transformFor(tree, part) { return state.transforms[transformId(tree, part)] ?? (state.transforms[transformId(tree, part)] = { dx: 0, dy: 0, scale: 1, rotate: 0 }); }
    function bounds(tree, part) {
      const layer = tree.parts[part]; const transform = transformFor(tree, part);
      return { x: layer.x + transform.dx - layer.w * (transform.scale - 1) / 2, y: layer.y + transform.dy - layer.h * (transform.scale - 1) / 2, w: layer.w * transform.scale, h: layer.h * transform.scale, rotate: transform.rotate };
    }
    function drawLayer(image, box) { context.save(); context.translate(box.x + box.w / 2, box.y + box.h / 2); context.rotate(box.rotate * Math.PI / 180); context.drawImage(image, -box.w / 2, -box.h / 2, box.w, box.h); context.restore(); }
    function drawHandles(item) {
      const box = item.box; context.save(); context.translate(box.x + box.w / 2, box.y + box.h / 2); context.rotate(box.rotate * Math.PI / 180);
      context.strokeStyle = '#ef6c32'; context.lineWidth = 5; context.setLineDash([14, 9]); context.strokeRect(-box.w / 2, -box.h / 2, box.w, box.h); context.setLineDash([]); context.fillStyle = '#fff';
      for (const corner of [[-box.w / 2, -box.h / 2], [box.w / 2, -box.h / 2], [-box.w / 2, box.h / 2], [box.w / 2, box.h / 2]]) { context.fillRect(corner[0] - 11, corner[1] - 11, 22, 22); context.strokeRect(corner[0] - 11, corner[1] - 11, 22, 22); }
      if (item.part === 'branch') { context.beginPath(); context.arc(0, -box.h / 2 - 46, 15, 0, Math.PI * 2); context.fill(); context.stroke(); context.beginPath(); context.moveTo(0, -box.h / 2); context.lineTo(0, -box.h / 2 - 30); context.stroke(); }
      context.restore();
    }
    function render() {
      if (!state.sheet) return; context.clearRect(0, 0, canvas.width, canvas.height); if (state.manifest.rendered || state.manifest.serverScene) context.drawImage(state.images[state.sheet.base], 0, 0); else if (state.manifest.dynamic) drawUploadedBase(state.sheet); else context.drawImage(state.images[state.sheet.base], 0, 0); state.scene = [];
      for (const part of ['trunk', 'branch', 'crown']) for (const tree of state.sheet.trees) { const layer = tree.parts[part]; if (!layer?.file) continue; const box = bounds(tree, part); const imageKey = state.manifest.serverScene ? layer.file : `${state.manifest.dynamic ? 'profile1' : state.sheet.slug}/${layer.file}`; drawLayer(state.images[imageKey], box); if (part !== 'trunk') state.scene.push({ tree, part, box }); }
      if (state.showUI && state.selected) drawHandles(state.selected);
    }
    function pointerPosition(event) { const rect = canvas.getBoundingClientRect(); return { x: (event.clientX - rect.left) * canvas.width / rect.width, y: (event.clientY - rect.top) * canvas.height / rect.height }; }
    function localPosition(point, item) { const box = item.box; const angle = -box.rotate * Math.PI / 180; const dx = point.x - box.x - box.w / 2; const dy = point.y - box.y - box.h / 2; return { x: dx * Math.cos(angle) - dy * Math.sin(angle), y: dx * Math.sin(angle) + dy * Math.cos(angle) }; }
    function hitHandle(point, item) { const local = localPosition(point, item); const box = item.box; if (item.part === 'branch' && Math.hypot(local.x, local.y + box.h / 2 + 46) < 26) return 'rotate'; for (const corner of [[-box.w / 2, -box.h / 2], [box.w / 2, -box.h / 2], [-box.w / 2, box.h / 2], [box.w / 2, box.h / 2]]) if (Math.abs(local.x - corner[0]) < 26 && Math.abs(local.y - corner[1]) < 26) return 'scale'; return null; }
    canvas.addEventListener('pointerdown', (event) => {
      const point = pointerPosition(event); let item = null; let mode = null; if (state.selected) { mode = hitHandle(point, state.selected); if (mode) item = state.selected; }
      if (!item) { item = [...state.scene].reverse().find((candidate) => { const local = localPosition(point, candidate); return Math.abs(local.x) <= candidate.box.w / 2 && Math.abs(local.y) <= candidate.box.h / 2; }); mode = 'move'; }
      if (!item) { state.selected = null; render(); return; }
      state.selected = item; const transform = transformFor(item.tree, item.part); const box = item.box; state.drag = { mode, point, dx: transform.dx, dy: transform.dy, scale: transform.scale, rotate: transform.rotate, cx: box.x + box.w / 2, cy: box.y + box.h / 2, distance: Math.hypot(point.x - box.x - box.w / 2, point.y - box.y - box.h / 2), angle: Math.atan2(point.y - box.y - box.h / 2, point.x - box.x - box.w / 2), key: transformId(item.tree, item.part), before: { ...transform } }; canvas.setPointerCapture(event.pointerId); render();
    });
    canvas.addEventListener('pointermove', (event) => { if (!state.drag || !state.selected) return; const point = pointerPosition(event); const drag = state.drag; const transform = transformFor(state.selected.tree, state.selected.part); if (drag.mode === 'move') { transform.dx = drag.dx + point.x - drag.point.x; transform.dy = drag.dy + point.y - drag.point.y; } else if (drag.mode === 'scale') { transform.scale = Math.max(.25, Math.min(3, drag.scale * Math.hypot(point.x - drag.cx, point.y - drag.cy) / Math.max(drag.distance, 1))); } else { transform.rotate = drag.rotate + (Math.atan2(point.y - drag.cy, point.x - drag.cx) - drag.angle) * 180 / Math.PI; } render(); });
    canvas.addEventListener('pointerup', (event) => { if (state.drag && state.selected) { const after = { ...transformFor(state.selected.tree, state.selected.part) }; if (JSON.stringify(state.drag.before) !== JSON.stringify(after)) { state.history.push({ key: state.drag.key, before: state.drag.before, after }); state.redo = []; saveTransforms(); } state.drag = null; } if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId); });
    document.addEventListener('keydown', (event) => { if (!event.ctrlKey && !event.metaKey) return; const key = event.key.toLowerCase(); const isRedo = key === 'y' || (key === 'z' && event.shiftKey); if (key !== 'z' && key !== 'y') return; event.preventDefault(); const source = isRedo ? state.redo : state.history; const destination = isRedo ? state.history : state.redo; const action = source.pop(); if (!action) return; state.transforms[action.key] = { ...(isRedo ? action.after : action.before) }; destination.push(action); saveTransforms(); render(); });
    document.querySelector('#export').addEventListener('click', () => { const selected = state.selected; state.showUI = false; render(); const download = document.createElement('a'); download.download = `profile_${state.sheet.slug}_final.jpg`; download.href = canvas.toDataURL('image/jpeg', .98); download.click(); state.showUI = true; state.selected = selected; render(); });
    async function useSheet() { state.sheet = state.manifest.sheets.find((sheet) => sheet.slug === select.value); const files = state.manifest.serverScene ? [state.sheet.base, ...state.sheet.trees.flatMap((tree) => Object.values(tree.parts).map((part) => part.file))] : state.manifest.rendered ? [state.sheet.base] : state.manifest.dynamic ? [...new Set(state.sheet.trees.flatMap((tree) => Object.values(tree.parts).map((part) => `profile1/${part.file}`)))] : [state.sheet.base, ...state.sheet.trees.flatMap((tree) => Object.values(tree.parts).filter((part) => part.file).map((part) => `${state.sheet.slug}/${part.file}`))]; await Promise.all(files.map(async (file) => { state.images[file] = await loadImage(state.manifest.serverScene || state.manifest.rendered ? file : assetUrl(file)); })); if (state.manifest.dynamic) { canvas.width = 4350; canvas.height = 4200; } else { const base = state.images[state.sheet.base]; canvas.width = base.width; canvas.height = base.height; } state.selected = null; loading.hidden = true; render(); }
    readServerScene().then((serverScene) => serverScene ? { ...serverScene, serverScene: true } : readRenderedProfiles().then((rendered) => rendered ? { rendered: true, sheets: rendered.map((item, index) => ({ name: item.sheetName, slug: `render-${index}`, base: item.imageDataUrl, trees: [] })) } : readUploadedScene().then((scene) => scene ? uploadedManifest(scene) : fetch('/profile-editor/scene-assets/scene-manifest.json').then((response) => { if (!response.ok) throw new Error('ไม่พบ scene assets'); return response.json(); })))).then(async (manifest) => { state.manifest = manifest; const key = transformStorageKey(); if (key) { try { state.transforms = JSON.parse(localStorage.getItem(key) || '{}'); } catch { state.transforms = {}; } } for (const sheet of manifest.sheets) select.add(new Option(sheet.name, sheet.slug)); select.addEventListener('change', useSheet); await useSheet(); }).catch((error) => { loading.textContent = `เปิด scene ไม่สำเร็จ: ${error.message}`; });
  </script>
</body>
</html>
